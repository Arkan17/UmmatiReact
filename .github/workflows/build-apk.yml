name: Build Android APK & Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to attach APK to (leave blank to only save artifact)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install npm dependencies
        run: npm ci || npm install

      - name: Grant execute permission for Gradlew
        run: chmod +x android/gradlew

      - name: Build Android Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Package Universal APK
        run: |
          mkdir -p build-output
          # Look for the universal apk first, then fall back to any release apk
          APK_PATH=$(find android/app/build/outputs/apk/release -name "*universal*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find android/app/build/outputs/apk/release -name "*release.apk" | head -n 1)
          fi
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          fi

          echo "Found APK: $APK_PATH"
          cp "$APK_PATH" build-output/Ummati.apk
          ls -lh build-output/Ummati.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ummati-APK
          path: build-output/Ummati.apk
          retention-days: 30

      - name: Attach APK to GitHub Release (Triggered by Release)
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: build-output/Ummati.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attach APK to GitHub Release (Manual Dispatch with Tag)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.tag_name != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name }}
          files: build-output/Ummati.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
